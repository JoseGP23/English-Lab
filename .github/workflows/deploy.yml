name: Desplegar en Azure

# Cada push a main compila la web y la sube al sitio estático de Azure Storage.
# Inicia sesión en Azure sin claves (OIDC); la identidad la crea scripts/setup-azure-deploy.sh.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: azure/login@v2
        with:
          client-id: __AZURE_CLIENT_ID__
          tenant-id: __AZURE_TENANT_ID__
          subscription-id: __AZURE_SUBSCRIPTION_ID__

      - name: Subir a Azure Storage ($web)
        run: az storage blob upload-batch --account-name englishlab28807 --auth-mode login -s dist -d '$web' --overwrite --only-show-errors
